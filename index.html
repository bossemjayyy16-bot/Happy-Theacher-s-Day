<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Teacher's Day</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <div class="sparkle">✦</div>

        <h1>Happy Teacher's Day! 💐</h1>

        <p class="subtitle">
            To our wonderful teacher
        </p>

        <!-- TEACHER'S PICTURE -->
        <div class="photo">
            <img src="IMG_1610.jpeg" alt="Teacher's Photo">
        </div>

        <h2>Thank You, Teacher! ❤️</h2>

        <p class="message">
            Thank you for your patience, kindness,
            and for inspiring us every day.
        </p>

        <div class="flowers">
            🌸 🌷 🌸
        </div>

        <p class="from">
            With love and gratitude ❤️
        </p>

    </div>

    <!-- Floating hearts -->
    <div class="hearts">
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
    </div>

</body>
</html>
